<!DOCTYPE HTML>
<html lang="pt-BR">
<head>
    <title>RPGAVR</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="keywords" content="rpgavr, rpg ação v reação, wilson costa">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    
    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="assets/css/main.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
    <link rel="shortcut icon" href="images/rpgavr.ico">

    <!-- Componente 3D WebGL (Google Model-Viewer) -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        /* Ajustes de Responsividade Personalizados */
        .embed-responsive-16by9 {
            max-width: 100%;
            margin: 0 auto;
        }
        
        /* Container para o seu Dado/Objeto 3D */
        .model-3d-container {
            width: 100%;
            height: 400px;
            max-width: 600px;
            margin: 20px auto;
            background: #1a1a1a;
            border-radius: 8px;
        }

        model-viewer {
            width: 100%;
            height: 100%;
        }

        canvas#canvas {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body class="is-preload">

<!-- Header -->
<section id="header">
    <header>
        <span class="image avatar"><img src="images/avatar.jpg" alt="Avatar" /></span>
        <h1 id="logo">
            <a href="https://linktr.ee/RPGAVR" class="btn btn-light font-weight-bold text-dark">Saiba Mais!</a>
            <a href="https://rpgavr-com.translate.goog/?_x_tr_sl=pt&_x_tr_tl=en&_x_tr_hl=pt-BR&_x_tr_pto=wapp">
                <img src="images/eua.png" alt="English Version" />
            </a>
        </h1>
    </header>
    <nav id="nav">
        <ul>
            <li><a href="#projeto" class="active">PROJETO</a></li>
            <li><a href="#regrasbásicas">REGRAS BÁSICAS</a></li>
            <li><a href="#raças">RAÇAS</a></li>
            <li><a href="#classes">CLASSES</a></li>
            <li><a href="#bestiário">BESTIÁRIO</a></li>
            <li><a href="#itens">ITENS</a></li>
            <li><a href="#cenários">CENÁRIOS</a></li>
            <li><a href="#rolagem">FERRAMENTAS</a></li>
        </ul>
    </nav>
</section>

<!-- Wrapper -->
<div id="wrapper">
    <div id="main">
        <div class="container-fluid p-3 p-md-5">

            <!-- Vídeo Responsivo -->
            <section id="introdução" class="my-4">
                <div class="embed-responsive embed-responsive-16by9">
                    <iframe class="embed-responsive-item" src="https://www.youtube.com/embed/4XsiWeciYSE" allowfullscreen></iframe>
                </div>
            </section>

            <!-- Visualizador 3D -->
            <section id="objeto-3d" class="my-5 text-center">
                <h3><strong style="color:black;">VISUALIZAÇÃO 3D</strong></h3>
                <div class="model-3d-container">
                    <!-- Substitua o src pelo caminho do seu arquivo 3D (.gltf ou .glb) -->
                    <model-viewer src="assets/models/seu_dado_3d.glb" 
                                  alt="Dado 3D RPGAVR" 
                                  auto-rotate 
                                  camera-controls 
                                  ar 
                                  shadow-intensity="1">
                    </model-viewer>
                </div>
            </section>

            <!-- Demais Seções Mantidas com Grid Limpo -->
            <section id="projeto" class="my-4">
                <h3><strong style="color:black;">CONHEÇA O PROJETO:</strong></h3>
                <p>O RPG Ação V Reação é o RPG oficial da Federação Brasileira de Gamificação na Educação - FEBRAGAME...</p>
            </section>

            <!-- Seção Canvas Responsivo -->
            <section id="cenários" class="my-4">
                <h3><strong style="color:black;">ADAPTANDO CENÁRIOS:</strong></h3>
                <div class="text-center">
                    <canvas id="canvas"></canvas>
                </div>
            </section>

        </div>
    </div>
</div>

<!-- JS Dependencies -->
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js"></script>
</body>
</html>
