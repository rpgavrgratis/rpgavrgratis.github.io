<!DOCTYPE HTML>
<html lang="pt-BR">
<head>
    <title>RPGAVR</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="keywords" content="rpgavr, rpg ação v reação, wilson costa">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    
    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="assets/css/main.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
    <link rel="shortcut icon" href="images/rpgavr.ico">

    <!-- Three.js para renderizar o D6 Vermelho -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        .embed-responsive-16by9 {
            max-width: 100%;
            margin: 0 auto;
        }
        
        .model-3d-container {
            width: 100%;
            height: 350px;
            max-width: 500px;
            margin: 20px auto;
            background: #111;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }

        #d6-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        canvas#canvas {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body class="is-preload">

<!-- Header -->
<section id="header">
    <header>
        <span class="image avatar"><img src="images/avatar.jpg" alt="Avatar" /></span>
        <h1 id="logo">
            <a href="https://linktr.ee/RPGAVR" class="btn btn-light font-weight-bold text-dark">Saiba Mais!</a>
            <a href="https://rpgavr-com.translate.goog/?_x_tr_sl=pt&_x_tr_tl=en&_x_tr_hl=pt-BR&_x_tr_pto=wapp">
                <img src="images/eua.png" alt="English Version" />
            </a>
        </h1>
    </header>
    <nav id="nav">
        <ul>
            <li><a href="#projeto" class="active">PROJETO</a></li>
            <li><a href="#regrasbásicas">REGRAS BÁSICAS</a></li>
            <li><a href="#raças">RAÇAS</a></li>
            <li><a href="#classes">CLASSES</a></li>
            <li><a href="#bestiário">BESTIÁRIO</a></li>
            <li><a href="#itens">ITENS</a></li>
            <li><a href="#cenários">CENÁRIOS</a></li>
            <li><a href="#rolagem">FERRAMENTAS</a></li>
        </ul>
    </nav>
</section>

<!-- Wrapper -->
<div id="wrapper">
    <div id="main">
        <div class="container-fluid p-3 p-md-5">

            <!-- Vídeo Responsivo -->
            <section id="introdução" class="my-4">
                <div class="embed-responsive embed-responsive-16by9">
                    <iframe class="embed-responsive-item" src="https://www.youtube.com/embed/4XsiWeciYSE" allowfullscreen></iframe>
                </div>
            </section>

            <!-- Visualizador 3D: D6 Vermelho -->
            <section id="objeto-3d" class="my-5 text-center">
                <h3><strong style="color:black;">DADO 3D (D6)</strong></h3>
                <div class="model-3d-container" id="dice-wrapper">
                    <canvas id="d6-canvas"></canvas>
                </div>
            </section>

            <!-- Projeto -->
            <section id="projeto" class="my-4">
                <h3><strong style="color:black;">CONHEÇA O PROJETO:</strong></h3>
                <p>O RPG Ação V Reação é o RPG oficial da Federação Brasileira de Gamificação na Educação - FEBRAGAME...</p>
            </section>

            <!-- Cenários -->
            <section id="cenários" class="my-4">
                <h3><strong style="color:black;">ADAPTANDO CENÁRIOS:</strong></h3>
                <div class="text-center">
                    <canvas id="canvas"></canvas>
                </div>
            </section>

        </div>
    </div>
</div>

<!-- JS Dependencies -->
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js"></script>

<!-- Script do Dado 3D Vermelho -->
<script>
    (function initD6() {
        const container = document.getElementById('dice-wrapper');
        const canvas = document.getElementById('d6-canvas');

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        // Luzes
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0xffffff, 0.8);
        pointLight.position.set(10, 10, 10);
        scene.add(pointLight);

        // Geometria e Material do D6 Vermelho
        const geometry = new THREE.BoxGeometry(2, 2, 2);
        const material = new THREE.MeshPhongMaterial({ 
            color: 0xcc0000, 
            specular: 0x555555, 
            shininess: 30 
        });

        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);

        camera.position.z = 6;

        // Animação de rotação contínua
        function animate() {
            requestAnimationFrame(animate);
            cube.rotation.x += 0.01;
            cube.rotation.y += 0.015;
            renderer.render(scene, camera);
        }
        animate();

        // Ajuste de redimensionamento responsivo do 3D
        window.addEventListener('resize', () => {
            const width = container.clientWidth;
            const height = container.clientHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        });
    })();
</script>

</body>
</html>
