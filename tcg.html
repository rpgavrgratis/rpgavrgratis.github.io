<!DOCTYPE HTML>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>RPGAVR - Deck de NPCs</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="assets/css/main.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<style>
  :root{
    --ouro: #FFD700;
    --fundo: #0d0d0d;
    --painel: #1a1a1a;
    --borda: #333;
    --verso: #4a0e0e;
  }

  * { box-sizing: border-box; }

  body{
    margin:0;
    background: var(--fundo);
    color:#eee;
    font-family: Arial, Helvetica, sans-serif;
    padding: 20px 12px 60px;
  }

  h1{
    text-align:center;
    color: var(--ouro);
    text-shadow: 0 0 8px rgba(255,215,0,0.35);
    margin-bottom: 4px;
  }
  .subtitulo{
    text-align:center;
    color:#aaa;
    margin-top:0;
    margin-bottom: 28px;
    font-size: 0.9rem;
  }

  .painel-controles{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom: 30px;
  }

  .btn{
    background-color:#333;
    color:#fff;
    border:1px solid #555;
    border-radius:6px;
    padding:10px 18px;
    font-weight:bold;
    cursor:pointer;
    transition: background-color .2s, transform .1s;
  }
  .btn:hover{ background-color:#555; }
  .btn:active{ transform: scale(0.96); }
  .btn:disabled{ opacity:0.4; cursor:not-allowed; }
  .btn-ouro{
    background-color: var(--ouro);
    color:#000;
    border-color: var(--ouro);
  }
  .btn-ouro:hover{ background-color:#e6c200; }

  .secao{
    max-width: 900px;
    margin: 0 auto 36px;
  }
  .secao h2{
    color: var(--ouro);
    border-bottom: 1px solid var(--borda);
    padding-bottom: 6px;
    font-size: 1.1rem;
  }

  /* ---- Baralho principal ---- */
  .area-baralho{
    display:flex;
    justify-content:center;
    align-items:center;
    gap: 40px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }

  .baralho-pilha{
    position:relative;
    width: 110px;
    height: 160px;
    cursor:pointer;
  }
  .baralho-pilha .carta-verso{
    position:absolute;
    width:100%;
    height:100%;
    border-radius:10px;
    background: linear-gradient(145deg, var(--verso), #1a0303) center/cover no-repeat;
    border: 2px solid var(--ouro);
    box-shadow: 0 4px 10px rgba(0,0,0,0.6);
    display:flex;
    align-items:center;
    justify-content:center;
    color: var(--ouro);
    font-size: 1.6rem;
    transition: transform .15s;
    overflow: hidden;
  }
  .baralho-pilha .carta-verso img{
    width:100%;
    height:100%;
    object-fit: cover;
  }
  .baralho-pilha:hover .carta-verso{ transform: translateY(-4px); }
  .baralho-pilha .carta-verso:nth-child(1){ transform: translate(4px,4px) rotate(-3deg); z-index:1; }
  .baralho-pilha .carta-verso:nth-child(2){ transform: translate(2px,2px) rotate(2deg); z-index:2; }
  .baralho-pilha .carta-verso:nth-child(3){ z-index:3; }
  .baralho-pilha:hover .carta-verso:nth-child(3){ transform: translateY(-6px); }

  .baralho-info{
    text-align:center;
    color:#ccc;
  }
  .baralho-info .numero{
    font-size: 2rem;
    color: var(--ouro);
    font-weight:bold;
    display:block;
  }

  /* ---- Cartas selecionadas ---- */
  .mesa{
    display:flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 16px;
    max-width: 900px;
    margin: 0 auto;
  }
  .mesa .slot,
  .mesa .carta{
    width: 140px;
    flex: 0 0 140px;
  }
  @media (max-width: 420px){
    .mesa .slot,
    .mesa .carta{
      width: 130px;
      flex: 0 0 130px;
    }
  }

  .slot{
    aspect-ratio: 2 / 3;
    border-radius: 10px;
    border: 2px dashed #444;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#555;
    font-size:0.8rem;
    text-align:center;
    padding:6px;
  }

  .carta{
    position: relative;
    aspect-ratio: 2 / 3;
    width:100%;
    border-radius: 10px;
    background: var(--painel);
    border: 2px solid var(--ouro);
    box-shadow: 0 3px 8px rgba(0,0,0,0.5);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    padding: 0;
    cursor:pointer;
    animation: revelar .35s ease;
    text-align:center;
    overflow: hidden;
  }
  .carta img{
    position:absolute;
    top:0; left:0;
    width:100%;
    height:100%;
    object-fit: cover;
    z-index: 0;
  }
  .carta:hover{ box-shadow: 0 0 14px rgba(255,215,0,0.5); }
  .carta .rotulo{
    position: relative;
    z-index: 1;
    width: 100%;
    background: linear-gradient(to top, rgba(0,0,0,0.85), rgba(0,0,0,0));
    padding: 18px 6px 8px;
  }
  .carta .numero-carta{
    font-size: 1.4rem;
    font-weight:bold;
    color: var(--ouro);
    text-shadow: 0 0 4px #000;
  }
  .carta .nome-carta{
    font-size: 0.8rem;
    color: #eee;
    margin-top: 2px;
  }
  .carta .dica{
    font-size: 0.6rem;
    color:#ccc;
    margin-top: 4px;
  }

  @keyframes revelar{
    from{ transform: scale(0.6) rotateY(90deg); opacity:0; }
    to{ transform: scale(1) rotateY(0deg); opacity:1; }
  }

  /* ---- Descarte ---- */
  .descarte-pilha{
    display:flex;
    flex-wrap:wrap;
    gap: 10px;
    justify-content:center;
    min-height: 130px;
    align-items:center;
  }
  .descarte-pilha .vazio{
    color:#555;
    font-style: italic;
  }
  .carta-mini{
    position: relative;
    width: 70px;
    height: 100px;
    border-radius: 6px;
    background: var(--painel);
    border: 1px solid #777;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    color:#999;
    font-size: 0.7rem;
    opacity: 0.85;
    overflow: hidden;
  }
  .carta-mini img{
    position:absolute;
    top:0; left:0;
    width:100%;
    height:100%;
    object-fit: cover;
    z-index:0;
  }
  .carta-mini .numero-carta{
    position: relative;
    z-index:1;
    font-size: 1rem;
    color: #fff;
    font-weight:bold;
    background: rgba(0,0,0,0.6);
    width:100%;
    padding: 2px 0;
  }

  .aviso{
    text-align:center;
    color: var(--ouro);
    min-height: 20px;
    margin-top: 14px;
    font-size: 0.9rem;
  }
</style>
</head>
<body>

<h1>Deck de NPCs</h1>
<p class="subtitulo">RPG Ação V Reação — clique no baralho para comprar, clique em uma carta da mesa para descartar</p>

<div class="painel-controles">
  <button class="btn btn-ouro" onclick="embaralhar()">Embaralhar</button>
  <button class="btn" onclick="reiniciarTudo()">Reiniciar Deck</button>
</div>

<section class="secao">
  <div class="area-baralho">
    <div class="baralho-pilha" id="pilha-baralho" onclick="comprarCarta()">
      <div class="carta-verso"><img src="images/cartas/verso.png" alt="" onerror="this.style.display='none'"></div>
      <div class="carta-verso"><img src="images/cartas/verso.png" alt="" onerror="this.style.display='none'"></div>
      <div class="carta-verso"><img src="images/cartas/verso.png" alt="" onerror="this.style.display='none'"></div>
    </div>
    <div class="baralho-info">
      <span class="numero" id="contador-baralho">34</span>
      cartas no baralho
    </div>
  </div>
  <p class="aviso" id="aviso"></p>
</section>

<section class="secao">
  <h2>Cartas Selecionadas (máx. 5)</h2>
  <div class="mesa" id="mesa"></div>
</section>

<section class="secao">
  <h2>Descarte (<span id="contador-descarte">0</span>)</h2>
  <div class="descarte-pilha" id="descarte"></div>
</section>

<section class="secao">
  <h2>Ferramentas</h2>
  <div class="vendas" style="text-align:center;">

    <!-- Estrutura do Contador de XP -->
    <div class="xp-counter-container">
      <button class="xp-btn" onclick="alterarXP(-1)">-</button>
      <span class="xp-display">XP: <span id="xp-valor">0</span></span>
      <button class="xp-btn" onclick="alterarXP(1)">+</button>
    </div>

    <!-- Estilização CSS -->
    <style>
      .xp-counter-container {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        background-color: #1a1a1a;
        padding: 8px 16px;
        border-radius: 8px;
        border: 1px solid #333;
        user-select: none;
      }

      .xp-display {
        color: #FFD700;
        font-size: 1.2rem;
        font-weight: bold;
        min-width: 90px;
        text-align: center;
      }

      .xp-btn {
        background-color: #333;
        color: #ffffff;
        border: 1px solid #555;
        border-radius: 4px;
        width: 32px;
        height: 32px;
        font-size: 1.2rem;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.2s, transform 0.1s;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .xp-btn:hover {
        background-color: #555;
      }

      .xp-btn:active {
        transform: scale(0.95);
      }

      /* Ajuste de alinhamento da face 6 do dado */
      .cube .back {
        display: grid !important;
        grid-template-columns: repeat(2, 1fr) !important;
        grid-template-rows: repeat(3, 1fr) !important;
        align-items: center !important;
        justify-items: center !important;
        padding: 10px !important;
      }
    </style>

    <!-- Lógica JavaScript -->
    <script>
      let xpAtual = 0;

      function alterarXP(valor) {
        xpAtual += valor;

        // Trava para não ficar menor que zero
        if (xpAtual < 0) {
          xpAtual = 0;
        }

        document.getElementById('xp-valor').innerText = xpAtual;
      }
    </script>

    <br><br>
    <div class="dado-container">
      <div class="dado" id="dado" onclick="rolarDado()">
        <div class="pips" id="dado-pips" data-value="1">
          <span class="pip p1"></span>
          <span class="pip p2"></span>
          <span class="pip p3"></span>
          <span class="pip p4"></span>
          <span class="pip p5"></span>
          <span class="pip p6"></span>
          <span class="pip p7"></span>
          <span class="pip p8"></span>
          <span class="pip p9"></span>
        </div>
      </div>
      <div class="dado-resultado" id="dado-resultado">Resultado: -</div>
    </div>

    <style>
      .dado-container{
        display:flex;
        flex-direction: column;
        align-items:center;
        justify-content:center;
        gap: 12px;
        margin-top: 10px;
      }
      .dado{
        width: 80px;
        height: 80px;
        background: #1a1a1a;
        border: 2px solid #FFD700;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.6);
        transition: transform .5s ease;
        cursor: pointer;
      }
      .dado.rolando{
        animation: dado-girar .5s linear;
      }
      @keyframes dado-girar{
        0%   { transform: rotate(0deg) scale(1); }
        50%  { transform: rotate(180deg) scale(0.9); }
        100% { transform: rotate(360deg) scale(1); }
      }
      .pips{
        display:grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        width:100%;
        height:100%;
        padding: 12px;
      }
      .pip{
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #FFD700;
        opacity: 0;
        justify-self:center;
        align-self:center;
      }
      .p1{ grid-column:1; grid-row:1; }
      .p2{ grid-column:2; grid-row:1; }
      .p3{ grid-column:3; grid-row:1; }
      .p4{ grid-column:1; grid-row:2; }
      .p5{ grid-column:2; grid-row:2; }
      .p6{ grid-column:3; grid-row:2; }
      .p7{ grid-column:1; grid-row:3; }
      .p8{ grid-column:2; grid-row:3; }
      .p9{ grid-column:3; grid-row:3; }

      .pips[data-value="1"] .p5{ opacity:1; }
      .pips[data-value="2"] .p1,
      .pips[data-value="2"] .p9{ opacity:1; }
      .pips[data-value="3"] .p1,
      .pips[data-value="3"] .p5,
      .pips[data-value="3"] .p9{ opacity:1; }
      .pips[data-value="4"] .p1,
      .pips[data-value="4"] .p3,
      .pips[data-value="4"] .p7,
      .pips[data-value="4"] .p9{ opacity:1; }
      .pips[data-value="5"] .p1,
      .pips[data-value="5"] .p3,
      .pips[data-value="5"] .p5,
      .pips[data-value="5"] .p7,
      .pips[data-value="5"] .p9{ opacity:1; }
      .pips[data-value="6"] .p1,
      .pips[data-value="6"] .p3,
      .pips[data-value="6"] .p4,
      .pips[data-value="6"] .p6,
      .pips[data-value="6"] .p7,
      .pips[data-value="6"] .p9{ opacity:1; }

      .dado-resultado{
        color:#FFD700;
        font-weight:bold;
        margin-top: 10px;
        text-align:center;
      }
    </style>

    <script>
      let rolando = false;

      function rolarDado() {
        if (rolando) return;
        rolando = true;

        const dado = document.getElementById('dado');
        const pips = document.getElementById('dado-pips');
        const resultado = document.getElementById('dado-resultado');

        dado.classList.add('rolando');
        resultado.textContent = 'Rolando...';

        setTimeout(() => {
          const valor = Math.floor(Math.random() * 6) + 1;
          pips.setAttribute('data-value', valor);
          resultado.textContent = 'Resultado: ' + valor;
          dado.classList.remove('rolando');
          rolando = false;
        }, 500);
      }
    </script>
  </div>
</section>

<script>
/* ==========================================================
   DADOS DAS CARTAS
   Edite o array abaixo para dar nome/descrição a cada NPC.
   Se deixar "nome" vazio, a carta mostra apenas o número.
   ========================================================== */
const TOTAL_CARTAS = 34;

let cartasBase = [];
for (let i = 1; i <= TOTAL_CARTAS; i++) {
  const numero = String(i).padStart(2, '0'); // 01, 02, ... 34
  cartasBase.push({
    id: i,
    nome: "",                                   // ex: "Guarda da Vila"
    detalhe: "",                                // ex: "Rank C - Camponês"
    imagem: `images/cartas/carta-${numero}.png` // caminho do arquivo da carta
  });
}

/* ==========================================================
   ESTADO DO JOGO
   ========================================================== */
let baralho = [];   // cartas ainda não compradas
let mesa = [];       // até 5 cartas selecionadas
let descarte = [];   // cartas descartadas

const MAX_MESA = 5;

function embaralhar(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function iniciarDeck() {
  baralho = embaralhar([...cartasBase]);
  mesa = [];
  descarte = [];
  render();
}

function embaralharBaralho() {
  embaralhar(baralho);
  mostrarAviso("Baralho embaralhado.");
  render();
}

function comprarCarta() {
  const vagas = mesa.filter(c => c === null || c === undefined);
  const posicaoLivre = mesa.length < MAX_MESA ? mesa.length : mesa.findIndex(c => c === null);

  if (mesa.filter(Boolean).length >= MAX_MESA) {
    mostrarAviso("As 5 vagas estão ocupadas. Descarte uma carta para comprar outra.");
    return;
  }

  if (baralho.length === 0) {
    mostrarAviso("O baralho acabou! Reinicie ou embaralhe o descarte de volta.");
    return;
  }

  const carta = baralho.pop();

  // acha primeira vaga vazia (null) ou adiciona no final
  const idxVazio = mesa.indexOf(null);
  if (idxVazio !== -1) {
    mesa[idxVazio] = carta;
  } else {
    mesa.push(carta);
  }

  mostrarAviso("");
  render();
}

function descartarCarta(indice) {
  const carta = mesa[indice];
  if (!carta) return;
  descarte.push(carta);
  mesa[indice] = null;
  render();
}

function reiniciarTudo() {
  if (!confirm("Isso vai juntar todas as cartas (mesa + descarte) e embaralhar um novo baralho de " + TOTAL_CARTAS + " cartas. Continuar?")) return;
  iniciarDeck();
  mostrarAviso("Deck reiniciado e embaralhado.");
}

function mostrarAviso(msg) {
  document.getElementById('aviso').textContent = msg;
}

function render() {
  document.getElementById('contador-baralho').textContent = baralho.length;
  document.getElementById('contador-descarte').textContent = descarte.length;

  // Mesa
  const mesaEl = document.getElementById('mesa');
  mesaEl.innerHTML = "";
  for (let i = 0; i < MAX_MESA; i++) {
    const carta = mesa[i];
    if (carta) {
      const div = document.createElement('div');
      div.className = 'carta';
      div.onclick = () => descartarCarta(i);
      div.innerHTML = `
        <img src="${carta.imagem}" alt="Carta ${carta.id}" onerror="this.style.display='none'">
        ${carta.nome ? `<div class="rotulo"><div class="nome-carta">${carta.nome}</div>${carta.detalhe ? `<div class="dica">${carta.detalhe}</div>` : ''}</div>` : ''}
      `;
      mesaEl.appendChild(div);
    } else {
      const div = document.createElement('div');
      div.className = 'slot';
      div.textContent = 'vazio';
      mesaEl.appendChild(div);
    }
  }

  // Descarte
  const descarteEl = document.getElementById('descarte');
  descarteEl.innerHTML = "";
  if (descarte.length === 0) {
    descarteEl.innerHTML = '<span class="vazio">Nenhuma carta descartada ainda.</span>';
  } else {
    descarte.slice().reverse().forEach(c => {
      const div = document.createElement('div');
      div.className = 'carta-mini';
      div.innerHTML = `<img src="${c.imagem}" alt="Carta ${c.id}" onerror="this.style.display='none'">`;
      descarteEl.appendChild(div);
    });
  }
}

// inicializa
iniciarDeck();
</script>

</body>
</html>
